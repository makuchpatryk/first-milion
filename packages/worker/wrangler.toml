name = "first-million"
main = "src/index.ts"
compatibility_date = "2026-10-12"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# SQLite-backed classes are the only kind the free plan allows. No storage API is used (BR-020).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby"]

# Public values only. Local secrets live in `.dev.vars` (see `.dev.vars.example`).
# `AUTH_EMULATOR` must never be set here, so it never reaches production.
[vars]
FIREBASE_PROJECT_ID = "first-million-dev"
ALLOWED_ORIGINS = "http://localhost:5173"

# Production (`wrangler deploy --env production`, spec 06). Wrangler does not inherit bindings,
# migrations or vars into an environment, so each is stated again. Public values only:
# `ADMIN_UIDS` is a secret (`wrangler secret put ADMIN_UIDS --env production`) and
# `AUTH_EMULATOR` must never exist here (decision 35, NFR-004); `test/config.test.ts` guards both.
# The two values below are the real Firebase project id and Pages domain (spelled with one `l`).
[env.production]
name = "first-million"

[env.production.vars]
FIREBASE_PROJECT_ID = "first-milion-4203b"
ALLOWED_ORIGINS = "https://first-milion.pages.dev"

[[env.production.durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[env.production.durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby"]
