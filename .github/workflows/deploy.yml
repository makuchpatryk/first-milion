name: Deploy

# Tags only (PRD §20 #36): pushing a version tag `vX.Y.Z` on a commit of `main` deploys. Nothing is
# deployed from a pull request, a branch or a manual run. The `production` environment holds the
# required reviewer (manual approval) and the values below; restrict it to the tag pattern
# `v*.*.*` under Settings > Environments > Deployment branches and tags.
#
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # The tag must sit on `main`, and the light checks must pass on exactly that commit
  # (ARCHITECTURE A7). The heavy checks already ran on the push to `main` (ci.yml).
  verify:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main; only commits of main are deployed."
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      # Repository secrets or environment secrets: the Cloudflare token needs Workers Scripts:Edit
      # and Cloudflare Pages:Edit.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Public web config (it ships in the JS anyway): environment variables, not secrets.
      # `VITE_AUTH_EMULATOR_URL` is deliberately absent (PRD §20 #35).
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web app
        run: pnpm build
      - name: Bundle size and no emulator in the build (NFR-005, NFR-004)
        run: pnpm bundle:check
      # `ADMIN_UIDS` is a Worker secret set once with `wrangler secret put --env production`.
      - name: Deploy the Worker
        run: pnpm --filter @fm/worker exec wrangler deploy --env production
      - name: Deploy the web app to Pages
        run: pnpm --filter @fm/worker exec wrangler pages deploy ../web/dist --project-name first-milion --branch main
