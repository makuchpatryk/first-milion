<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Utwórz pokój</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #07090d; color: #e6edf3; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; padding: 24px; display: flex; flex-direction: column; gap: 20px">
<a href="Rooms.dc.html" style="display: flex; align-items: center; min-height: 44px; color: #7d8a99; font-size: 14px; text-decoration: none">← Pokoje</a>
<h1 style="margin: 0; font-size: 28px; letter-spacing: -0.02em; font-weight: 700">Utwórz pokój</h1>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="rname" style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #7d8a99">Nazwa pokoju (3–30 znaków)</label>
<input id="rname" type="text" placeholder="np. Piątkowa liga" style="box-sizing: border-box; height: 48px; border: 1px solid #1c2530; border-radius: 6px; background: #0f141b; padding: 0 14px; font: 16px 'Space Grotesk', sans-serif; color: #e6edf3">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #7d8a99">Czas rundy</span>
<div style="display: flex; gap: 8px">
<sc-for list="{{ durs }}" as="d" hint-placeholder-count="3">
<button onClick="{{ d.pick }}" aria-pressed="{{ d.pressed }}" style="flex: 1; height: 48px; border-radius: 4px; cursor: pointer; font: 500 15px 'JetBrains Mono', monospace; background: {{ d.bg }}; color: {{ d.fg }}; border: 1px solid {{ d.bd }}">{{ d.label }}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #7d8a99">Tempo</span>
<div style="display: flex; gap: 8px">
<sc-for list="{{ spds }}" as="s" hint-placeholder-count="3">
<button onClick="{{ s.pick }}" aria-pressed="{{ s.pressed }}" style="flex: 1; height: 48px; border-radius: 4px; cursor: pointer; font: 500 15px 'JetBrains Mono', monospace; background: {{ s.bg }}; color: {{ s.fg }}; border: 1px solid {{ s.bd }}">{{ s.label }}</button>
</sc-for>
</div>
<p style="margin: 0; font-size: 12px; color: #7d8a99">Tempo jest stałe w całej rundzie. W pokoju nie ma pauzy.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="target" style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #7d8a99">Cel zysku w $ (opcjonalnie)</label>
<input id="target" type="number" min="100" placeholder="min. 100, np. 500" style="box-sizing: border-box; height: 48px; border: 1px solid #1c2530; border-radius: 6px; background: #0f141b; padding: 0 14px; font: 16px 'JetBrains Mono', monospace; color: #e6edf3">
<p style="margin: 0; font-size: 12px; color: #7d8a99; line-height: 1.45">Runda kończy się po upływie czasu albo gdy ktoś pierwszy osiągnie cel.</p>
</div>
<a href="Lobby.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 6px; background: #f5c451; color: #1a1405; font-weight: 700; font-size: 17px; text-decoration: none">Utwórz pokój</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { dur: 5, spd: 3 };
renderVals() {
const s = this.state;
const mk = (list, key, cur, fmt) => list.map((v) => ({
label: fmt(v),
pick: () => this.setState({ [key]: v }),
pressed: cur === v ? 'true' : 'false',
bg: cur === v ? '#f5c451' : '#0f141b',
fg: cur === v ? '#1a1405' : '#e6edf3',
bd: cur === v ? '#f5c451' : '#1c2530'
}));
return {
durs: mk([3, 5, 10], 'dur', s.dur, (v) => v + ' min'),
spds: mk([1, 3, 8], 'spd', s.spd, (v) => v + '×')
};
}
}
</script>
</body>
</html>
